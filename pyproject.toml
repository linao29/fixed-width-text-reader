[project]
name = "fixed-width-text-reader"
version = "0.1.0"
description = "Parses fixed-column-width flat files into typed records using a field-specification list."
requires-python = ">=3.10"
dependencies = []
readme = "README.md"

[build-system]
requires = ["setuptools>=68"]
